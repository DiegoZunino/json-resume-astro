version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly, grouped: a handful of pull requests a month instead of one per package a week.
    schedule:
      interval: monthly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testing:
        patterns: ['vitest', '@vitest/*', 'playwright', 'playwright-core', '@playwright/*', '@axe-core/*']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'globals']
      # Everything else that is not a major update, in one pull request.
      other:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Follows the Node version in .nvmrc, not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (the native compiler) waits for astro check and typescript-eslint.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # init and upload-sarif must move together: half an update breaks the analysis.
      codeql:
        patterns: ['github/codeql-action*']
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
