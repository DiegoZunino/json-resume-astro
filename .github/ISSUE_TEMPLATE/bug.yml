name: Bug
description: Something renders wrong, a test fails, or the build breaks.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: resume
    attributes:
      label: Smallest JSON Resume that shows it (no personal data)
      render: json
  - type: input
    id: env
    attributes:
      label: Browser / OS / Node version
