# Publishes the site to Netlify, built from the real resume (RESUME_SOURCE_* variables).
#
# Runs:
#  - after the ci workflow has passed on main (workflow_run: the checks run once per push);
#  - when the resume changes: repository_dispatch "resume-updated" sent by whoever writes
#    the gist, with the gist revision in client_payload.revision;
#  - every hour, as a cheap check: if the published /build-info.json names another commit
#    or another gist revision than the current ones, it rebuilds. This covers edits made by hand on the gist,
#    which cannot trigger a workflow (gists have no webhooks). Scheduled workflows of a
#    public repository are paused by GitHub after 60 days without activity;
#  - by hand (workflow_dispatch, from main only).
#
# Whatever the trigger, only a commit of main whose ci run passed is built: after ci its
# head_sha, otherwise the latest green commit (with a warning if main's HEAD is not green).
#
# Three jobs with separate privileges: "build" runs npm and Chromium but never sees the
# Netlify token; "publish" sees the token but runs no third-party code (curl and jq only);
# "verify" checks that the live site serves the revision that was just built.
#
# A fourth job, "private", builds the reserved CVs (PDFs with private fields such as the phone,
# with and without photo, and the Europass XML) when the RESUME_PRIVATE secret exists; they are published under a
# secret path that nothing on the site links to (ADR 8). The job hands them to "publish" only
# encrypted, because artifacts of a public repository can be downloaded by anyone.
#
# Secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID; optional RESUME_PRIVATE (see the README).
# Variables: SITE_URL; RESUME_GIST ("<user>/<id>", or just "<id>" for a gist of the repository
# owner, with resume.json and resume.en.json) or RESUME_SOURCE_IT / RESUME_SOURCE_EN (any URL, e.g. an API).
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [resume-updated]
  schedule:
    - cron: '23 * * * *'
    # Weekly rebuild even without changes: dates computed at build time (an "upcoming"
    # talk that has now been given) stay true.
    - cron: '41 5 * * 1' # the same string is tested below, in the revision job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  revision:
    name: Commit and resume revision
    # After ci, only when it passed on a push to main; by hand, only from main.
    if: >-
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      revision: ${{ steps.resolve.outputs.revision }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GIST: ${{ vars.RESUME_GIST }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PAYLOAD_REVISION: ${{ github.event.client_payload.revision }}
          SITE_URL: ${{ vars.SITE_URL }}
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # The commit to build: never one whose checks did not pass.
          if [ "$EVENT" = workflow_run ]; then
            sha="$HEAD_SHA"
            # A re-run of an old ci run must not publish old code over newer code.
            head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            if [ "$sha" != "$head" ]; then
              echo "::notice::$sha is no longer the HEAD of main ($head): nothing to publish"
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            sha="$(gh run list -R "$REPO" --workflow ci.yml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // ""')"
            head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            if [ -n "$sha" ] && [ "$sha" != "$head" ]; then
              echo "::warning::main is at $head, whose checks have not passed (yet): building $sha"
            fi
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No commit of main with passing checks"; exit 1; }

          revision="${PAYLOAD_REVISION:-}"
          if [ -z "$revision" ] && [ -n "$GIST" ]; then
            # Read from the gist's git repository: the job token cannot use the gists API.
            revision="$(git ls-remote "https://gist.github.com/${GIST#*/}.git" HEAD | cut -f1)"
          fi
          if [ -n "$revision" ] && ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid gist revision: $revision"; exit 1
          fi

          build=true
          # The weekly cron (declared above) always rebuilds; the hourly one only on changes.
          if [ "$EVENT" = schedule ] && [ "$CRON" != '41 5 * * 1' ]; then
            live="$(curl -fsS --max-time 10 "$SITE_URL/build-info.json" 2>/dev/null || echo '{}')"
            if [ "$(jq -r '.commit // ""' <<<"$live")" = "$sha" ] && [ "$(jq -r '.resume // ""' <<<"$live")" = "$revision" ]; then
              build=false
            fi
          fi
          {
            echo "sha=$sha"
            echo "revision=$revision"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Commit $sha, gist revision ${revision:-none}: build=$build"

  build:
    name: Build from the real resume
    needs: revision
    if: needs.revision.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.revision.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resume sources
        env:
          GIST: ${{ vars.RESUME_GIST }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ needs.revision.outputs.revision }}
          SOURCE_IT: ${{ vars.RESUME_SOURCE_IT }}
          SOURCE_EN: ${{ vars.RESUME_SOURCE_EN }}
        run: |
          set -euo pipefail
          # The raw URL pinned to a revision bypasses the few minutes of cache of the unpinned one.
          if [ -n "$GIST" ]; then
            [[ "$GIST" == */* ]] || GIST="$OWNER/$GIST"
            base="https://gist.githubusercontent.com/$GIST/raw${REVISION:+/$REVISION}"
            SOURCE_IT="$base/resume.json"; SOURCE_EN="$base/resume.en.json"
          fi
          # Without a source the build would publish the example resume: stop instead.
          if [ -z "$SOURCE_IT" ] || [ -z "$SOURCE_EN" ]; then
            echo "::error::No resume source: set the RESUME_GIST variable (or RESUME_SOURCE_IT and RESUME_SOURCE_EN)."
            exit 1
          fi
          echo "RESUME_SOURCE_IT=$SOURCE_IT" >> "$GITHUB_ENV"
          echo "RESUME_SOURCE_EN=$SOURCE_EN" >> "$GITHUB_ENV"
      - name: Build (fails on schema errors, private-data leaks or a photo that cannot be fetched)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          RESUME_STRICT_PHOTO: '1'
          # "netlify" or "off"; undefined (empty) keeps the choice in resume.config.ts.
          CONTACT_FORM: ${{ vars.CONTACT_FORM }}
        run: npm run build
      - run: npm run validate:html
      - name: The repository linked in the footer exists (no 404 where the page promises the code)
        run: |
          set -euo pipefail
          repo="$({ grep -Eo '<a[^>]*data-repository[^>]*>' dist/index.html || true; } | grep -Eo 'href="[^"]+"' | head -1 | cut -d'"' -f2)"
          if [ -n "$repo" ]; then curl -fsSIL --max-time 15 -o /dev/null "$repo" || { echo "::error::$repo does not answer"; exit 1; }; fi
      - name: Record what was built
        env:
          SHA: ${{ needs.revision.outputs.sha }}
          REVISION: ${{ needs.revision.outputs.revision }}
        run: |
          jq -n --arg commit "$SHA" --arg resume "$REVISION" --arg run "$GITHUB_RUN_ID" \
            '{commit: $commit, resume: $resume, run: $run}' > dist/build-info.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

  private:
    name: Reserved CVs (only with the RESUME_PRIVATE secret)
    needs: revision
    if: needs.revision.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Is RESUME_PRIVATE set?
        env:
          RESUME_PRIVATE: ${{ secrets.RESUME_PRIVATE }}
        run: |
          set -euo pipefail
          if [ -z "$RESUME_PRIVATE" ]; then
            echo "No RESUME_PRIVATE secret: only the public CVs are published."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # {"path": "<16+ letters, digits, - or _>", "fields": {<private fields, e.g. "basics": {"phone": "…"}>}}
          jq -e '(.path | type == "string" and test("^[A-Za-z0-9_-]{16,}$")) and (.fields | type == "object")' \
            <<<"$RESUME_PRIVATE" >/dev/null || { echo "::error::RESUME_PRIVATE is not valid (see the README)"; exit 1; }
          echo "::add-mask::$(jq -r .path <<<"$RESUME_PRIVATE")"
          jq -r '.fields | [paths(scalars) as $p | getpath($p) | tostring] | .[]' <<<"$RESUME_PRIVATE" \
            | while IFS= read -r value; do echo "::add-mask::$value"; done
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.revision.outputs.sha }}
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci
      - if: steps.check.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.check.outputs.enabled == 'true'
        name: Resume sources with the private fields
        env:
          GIST: ${{ vars.RESUME_GIST }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ needs.revision.outputs.revision }}
          SOURCE_IT: ${{ vars.RESUME_SOURCE_IT }}
          SOURCE_EN: ${{ vars.RESUME_SOURCE_EN }}
          RESUME_PRIVATE: ${{ secrets.RESUME_PRIVATE }}
        run: |
          set -euo pipefail
          if [ -n "$GIST" ]; then
            [[ "$GIST" == */* ]] || GIST="$OWNER/$GIST"
            base="https://gist.githubusercontent.com/$GIST/raw${REVISION:+/$REVISION}"
            SOURCE_IT="$base/resume.json"; SOURCE_EN="$base/resume.en.json"
          fi
          mkdir -p "$RUNNER_TEMP/private-src"
          for pair in "it=$SOURCE_IT" "en=$SOURCE_EN"; do
            locale="${pair%%=*}"; source="${pair#*=}"
            [ -n "$source" ] || { echo "::error::No resume source for $locale"; exit 1; }
            curl -fsS --max-time 30 "$source" \
              | jq --argjson fields "$(jq .fields <<<"$RESUME_PRIVATE")" '. * $fields' \
              > "$RUNNER_TEMP/private-src/$locale.json"
          done
          # The private fields to keep in the PDFs: every leaf of "fields", as dotted paths.
          keep="$(jq -r '.fields | [paths(scalars) | map(tostring) | join(".")] | join(",")' <<<"$RESUME_PRIVATE")"
          echo "KEEP=$keep" >> "$GITHUB_ENV"
      - if: steps.check.outputs.enabled == 'true'
        name: Reserved PDFs, with and without photo
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/private-src"
          keep=(); IFS=, read -ra paths <<<"$KEEP"; for p in "${paths[@]}"; do keep+=(--keep "$p"); done
          # Same names as the public PDFs (pdfName in resume.config.ts), plus "-no-photo".
          npm run pdf -- --source "it=$src/it.json" --source "en=$src/en.json" --out private "${keep[@]}"
          npm run pdf -- --source "it=$src/it.json" --source "en=$src/en.json" --out private "${keep[@]}" \
            --no-photo --name '{pdf}-no-photo'
          # Europass CV XML for each locale, for the import into the Europass editor (no phone:
          # its XML structure is not verified, ADR 9).
          for locale in it en; do
            npm run europass -- --source "$src/$locale.json" --out "private/europass-$locale.xml" --lang "$locale" \
              --keep "$KEEP"
          done
          rm -rf "$src"
          ls -l private
      - if: steps.check.outputs.enabled == 'true'
        name: Encrypt (the artifact of a public repository is public)
        env:
          RESUME_PRIVATE: ${{ secrets.RESUME_PRIVATE }}
        run: |
          set -euo pipefail
          tar -C private -cf - . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:RESUME_PRIVATE -out private.tar.enc
          rm -rf private
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private
          path: private.tar.enc
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to Netlify
    needs: [build, private]
    if: always() && needs.build.result == 'success' && needs.private.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    outputs:
      deploy: ${{ steps.upload.outputs.deploy }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - if: needs.private.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: private
          path: .
      - if: needs.private.outputs.enabled == 'true'
        name: Reserved CVs under the secret path, never indexed
        env:
          RESUME_PRIVATE: ${{ secrets.RESUME_PRIVATE }}
        run: |
          set -euo pipefail
          dir="$(jq -r .path <<<"$RESUME_PRIVATE")"
          echo "::add-mask::$dir"
          mkdir -p "dist/$dir"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:RESUME_PRIVATE -in private.tar.enc \
            | tar -C "dist/$dir" -xf -
          rm private.tar.enc
          printf '\n/%s/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n  Cache-Control: no-store\n' "$dir" >> dist/_headers
          ls "dist/$dir"
      - id: upload
        name: Zip upload through the API (curl only, no third-party code sees the token)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          (cd dist && zip -qr ../site.zip .)
          response="$(curl -fsS --max-time 300 \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/zip" \
            --data-binary @site.zip "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")"
          id="$(jq -r .id <<<"$response")"
          [[ "$id" =~ ^[0-9a-f]{24}$ ]] || { echo "::error::Unexpected Netlify answer"; exit 1; }
          echo "deploy=$id" >> "$GITHUB_OUTPUT"
          # Wait until Netlify has processed the upload: "ready", or fail on "error".
          # A failed status request (a transient 5xx) is retried, not fatal.
          for _ in $(seq 1 30); do
            state="$(curl -fsS --max-time 15 -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$id" | jq -r .state || echo unknown)"
            echo "Deploy $id: $state"
            case "$state" in
              ready) break ;;
              error) echo "::error::Netlify could not publish deploy $id"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$state" = ready ] || { echo "::error::Deploy $id not ready after five minutes"; exit 1; }
      - if: needs.private.outputs.enabled == 'true'
        name: The reserved CVs are online and not indexable
        env:
          RESUME_PRIVATE: ${{ secrets.RESUME_PRIVATE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          dir="$(jq -r .path <<<"$RESUME_PRIVATE")"
          echo "::add-mask::$dir"
          for file in dist/"$dir"/*; do
            headers="$(curl -fsSI --max-time 15 "$SITE_URL/$dir/$(basename "$file")")"
            grep -qi 'x-robots-tag: noindex' <<<"$headers" || { echo "::error::$(basename "$file") is indexable"; exit 1; }
          done

  verify:
    name: Verify the live site
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - name: The live site serves what was built
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          expected="$(jq -cS . dist/build-info.json)"
          live=""
          for _ in $(seq 1 12); do
            live="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$SITE_URL/build-info.json" | jq -cS . || true)"
            [ "$live" = "$expected" ] && break
            sleep 10
          done
          [ "$live" = "$expected" ] || { echo "::error::Live build '$live', expected '$expected'"; exit 1; }
          home="$(curl -fsS --max-time 15 "$SITE_URL/")"
          grep -q '<h1' <<<"$home"
          # The photo, when the resume has one, must be the real one, not the monogram.
          if jq -e '.basics.image' dist/resume.json >/dev/null; then grep -Eq '<img[^>]+class="photo' <<<"$home"; fi
          curl -fsS --max-time 15 -o /dev/null "$SITE_URL/resume.json"
          for pdf in dist/*.pdf; do
            curl -fsSI --max-time 15 "$SITE_URL/${pdf#dist/}" | grep -qi 'content-type: application/pdf'
          done
